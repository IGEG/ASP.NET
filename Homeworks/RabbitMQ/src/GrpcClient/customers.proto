syntax = "proto3";

option csharp_namespace = "Pcf.GivingToCustomer.WebHost.Protos";

package customer;

service CustomerGrpcService {
	rpc GetCustomer (GetCustomerRequest) returns (CustomerResponse);
	rpc GetCustomers (GetAllRequest) returns (CustomersListResponse);
	rpc CreateCustomer (CreateCustomerRequest) returns (CustomerResponse);
	rpc UpdateCustomer (UpdateCustomerRequest) returns (CustomerResponse);
	rpc DeleteCustomer (DeleteCustomerRequest) returns (DeleteCustomerResponse);
}


message GetCustomerRequest { string id = 1; }

message GetAllRequest {}

message CreateCustomerRequest {
	string first_name = 1;
	string last_name = 2;
	string email = 3;
	repeated string preference_ids = 4;
}

message UpdateCustomerRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  repeated string preference_ids = 5;
}

message DeleteCustomerRequest {
  string id = 1;
}

message CustomerResponse {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  repeated PreferenceResponse preferences = 5;
  repeated PromoCodeShortResponse promoCodes = 6;
}

message PreferenceResponse {
  string id = 1;
  string name = 2;
}

message PromoCodeShortResponse {
  string id = 1;
  string code = 2;
  string service_info = 3;
  string begin_date = 4;
  string end_date = 5;
  string partner_id = 6;
}

message CustomersListResponse {
  repeated CustomerResponse customers = 1;
}

message DeleteCustomerResponse {
  bool success = 1;
  string message = 2;
}
